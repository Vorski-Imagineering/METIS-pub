# Cross-cutting topic tags, injected as front matter by assemble_docs.py.
#
# Lives here rather than in the pages themselves because docs-pub/ is synced from the
# METIS source repo and any front matter added there would be lost on the next sync.
#
# Keys are paths relative to the assembled site_src/ (so README.md is already index.md).
# Keep the vocabulary small — a tag that lands on half the site sorts nothing.
#
# Vocabulary:
#   linkedin       — anything that reads from or writes to LinkedIn
#   publishing     — turning a recorded conversation into public media
#   permissions    — who can see and do what
#   api            — HTTP surfaces and integration
#   configuration  — setup you do once, as an administrator

