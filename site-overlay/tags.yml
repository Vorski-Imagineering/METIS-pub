# Topic tags for THIS repo's own pages, injected as front matter by assemble_docs.py.
#
# The docs pages' tags — and the tag vocabulary both files are checked against — live in
# METIS's docs/pub/tags.yml, beside the pages they tag, and arrive as docs-pub/tags.yml.
# A tag here that is not in that vocabulary fails the build (METIS-pub#434).
#
# Keys are paths relative to the assembled site_src/ (so README.md is already index.md).

pages:
  automation/linkedin-automation/index.md: [linkedin]
  automation/metis/index.md: [api]
