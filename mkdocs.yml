site_name: METIS-pub Docs
site_url: https://docs.the-gathering.earth/
repo_url: https://github.com/Vorski-Imagineering/METIS-pub
repo_name: Vorski-Imagineering/METIS-pub
docs_dir: site_src

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    # Top-level nav entries become tabs: Home / METIS Docs / Automation / Tags / Project.
    - navigation.tabs
    # Render each group as a labelled block in the sidebar rather than a collapsed folder.
    - navigation.sections
    # A section whose SUMMARY.md entry carries a link uses that page as its landing page,
    # so clicking "Job reference" opens the IRIS job index instead of only expanding it.
    # Note: incompatible with toc.integrate — do not enable both.
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy

# There is no `nav:` here on purpose. The navigation is read by mkdocs-literate-nav from
# SUMMARY.md files — a nav enumerated here silently rots every time upstream adds a page.
# site-overlay/SUMMARY.md covers this repo's own pages and cross-links the docs section to
# docs-pub/SUMMARY.md, which comes from METIS's docs/pub/ beside the pages it lists
# (METIS-pub#434).
plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  # The tags index is tags.md, which carries the `material/tags` listing directive.
  # There is no tags_allowed here: the vocabulary is declared once, in METIS's
  # docs/pub/tags.yml, and enforced against both tag files by assemble_docs.py — and in
  # METIS by deploy/check_docs_pub.py, before the merge. A second list here would be a
  # vocabulary that has to agree with that one with nothing checking it (METIS-pub#434).
  # Old …/README/ URLs are kept alive by .github/scripts/write_legacy_redirects.py, which
  # runs after the build. mkdocs-redirects cannot do this: it treats README.md as a
  # directory index, so the mapping collapses onto the real page and overwrites it.
  - tags

# SUMMARY.md drives the sidebar; literate-nav still reads it, but it should not also be
# published as a page or turn up in search results.
exclude_docs: |
  SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
