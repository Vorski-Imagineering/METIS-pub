# Topic tags for docs/pub pages, injected as front matter by METIS-pub's
# assemble_docs.py. They live here, beside the pages, because a tag on a page that has
# been renamed or removed fails the site build — and until METIS-pub#434 the tags lived
# in the other repo, where nothing noticed until after merge.
#
# The vocabulary is declared here once and is the allowed set for both repos:
# deploy/check_docs_pub.py refuses an unknown tag at merge, and assemble_docs.py refuses
# one at build. Keep it small — a tag that lands on half the site sorts nothing.
#
# Keys are paths relative to docs/pub/, as the files are named here. Tagging is optional;
# a page absent from `pages` simply carries no tags. METIS-pub keeps its own
# automation/* keys in site-overlay/tags.yml.

vocabulary:
  linkedin: anything that reads from or writes to LinkedIn
  publishing: turning a recorded conversation into public media
  permissions: who can see and do what
  api: HTTP surfaces and integration
  configuration: setup you do once, as an administrator

pages:
