name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material mkdocs-literate-nav

      # Copies the published trees into site_src/, renames README.md -> index.md (and
      # rewrites links), applies site-overlay/, normalizes Markdown, injects tags.
      # See DOCS-CONVENTIONS.md.
      - name: Assemble doc sources
        run: python3 .github/scripts/assemble_docs.py

      # A page that publishes but appears in no sidebar is unreachable in practice.
      # Fail the build rather than ship it.
      - name: Check every page is reachable from the nav
        run: python3 .github/scripts/check_nav_coverage.py

      - run: mkdocs build --strict

      # README.md pages became index.md; keep the already-published …/README/ URLs alive.
      - name: Write legacy redirect stubs
        run: python3 .github/scripts/write_legacy_redirects.py

      - name: Set custom domain
        run: echo "docs.the-gathering.earth" > site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
